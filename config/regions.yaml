      name: Central Bank of Kenya
      url: https://www.centralbank.go.ke/press-releases/
      type: html
      category: ke_regulatory
      label: CBK Press Releases
      selectors:
        articles: h3 a, .press-release a, article h2 a, .entry-title a
    - id: ke_github
      name: GitHub Kenya Web3
      url: https://api.github.com/search/repositories
      type: api_json
      category: ke_dev_activity
      label: GitHub Kenya/Nairobi Web3
      params:
        q: web3 kenya OR nairobi blockchain OR mpesa defi OR kenya fintech
        sort: updated
        per_page: 15

      name: TechPoint Africa
      url: https://techpoint.africa/feed/
      type: rss
      category: ke_tech_news
      label: TechPoint Africa
    - id: ke_ventureburn
      name: VentureBurn
      url: https://ventureburn.com/feed/
      type: rss
      category: ke_startup_news
      label: "VentureBurn \u2014 Africa startup news"

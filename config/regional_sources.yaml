# ── Social Media API Keys ─────────────────────────────────────
# Set these as environment variables or in config/config.yaml
social_keys:
  twitter:
    env_var: "TWITTER_BEARER_TOKEN"
    docs: "https://developer.twitter.com/en/docs/authentication/oauth-2-0/bearer-tokens"
    tier_required: "Basic ($100/month) or higher"
    fallback: "RSS-based news aggregators used when key not set"

  farcaster:
    env_var: null
    docs: "https://docs.farcaster.xyz/reference/hubble/httpapi/casts"
    tier_required: "Free — no key needed"
    note: "Uses Warpcast public API"

  linkedin:
    env_var: "LINKEDIN_ACCESS_TOKEN"
    docs: "https://learn.microsoft.com/en-us/linkedin/shared/authentication"
    tier_required: "Partner Program required for company/post data"
    fallback: "Crunchbase RSS used as verified funding intelligence alternative"
    note: "Direct scraping violates LinkedIn ToS — not implemented"

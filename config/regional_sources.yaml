        url: "https://disrupt-africa.com/feed/"
        type: "rss"
        category: "startup_news"
        verified: true

      - id: "ea_weetracker"
        name: "WeeTracker — Africa Startup Intelligence"
        url: "https://weetracker.com/feed/"
        type: "rss"
        category: "startup_funding"
        verified: true

      - id: "ea_techcrunch_africa"
        name: "TechCrunch Africa"
        url: "https://techcrunch.com/tag/africa/feed/"
        type: "rss"
        category: "tech_news"
        verified: true

      - id: "ea_ventureburn"
        name: "VentureBurn — Africa"
        url: "https://ventureburn.com/feed/"
        type: "rss"
        category: "startup_news"
        verified: true

      - id: "ea_africaarena"
        name: "Africa Arena — Startup Database"
        url: "https://africaarena.com/feed"
        type: "rss"
        category: "ecosystem"
        verified: true

      - id: "ea_github_activity"
        name: "GitHub — East Africa Dev Activity"
        url: "https://api.github.com/search/repositories"
        type: "api_json"
        category: "dev_activity"
        verified: true
        params:
          q: "blockchain tanzania OR web3 uganda OR fintech rwanda OR defi ethiopia"
          sort: "updated"
          per_page: 20

      - id: "ea_coingecko_africa"
        name: "CoinGecko — Africa Category"
        url: "https://api.coingecko.com/api/v3/coins/markets"
        type: "api_json"
        category: "crypto_market"
        verified: true
        params:
          vs_currency: "usd"
          category: "african-projects"
          order: "market_cap_desc"
          per_page: 20

  # ── NIGERIA ────────────────────────────────────────────────
  NG:
    name: "Nigeria"

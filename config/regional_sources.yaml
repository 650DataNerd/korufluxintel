        url: "https://nairametrics.com/feed/"
        type: "rss"
        category: "financial_news"
        verified: true

      - id: "ng_coindesk_nigeria"
        name: "CoinDesk — Nigeria Tag"
        url: "https://www.coindesk.com/arc/outboundfeeds/rss/"
        type: "rss"
        category: "crypto_news"
        verified: true
        filter_keyword: "nigeria"

      - id: "ng_sec_news"
        name: "SEC Nigeria — Press Releases"

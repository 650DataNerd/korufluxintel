# ============================================================
# KoruFlux Intelligence System — Regional Sources Config
# ============================================================
# All sources are verified public feeds.
# Each region has dedicated sources — no cross-contamination.
# Social sources are clearly marked with their API requirements.
# ============================================================

regions:

  # ── KENYA / NAIROBI ────────────────────────────────────────
  KE:
    name: "Kenya / Nairobi"
    code: "KE"
    regulatory_bodies: ["CMA", "CBK", "KEBS", "ODPC"]
    currency: "KES"
    sources:

      - id: "ke_cbk_press"
        name: "Central Bank of Kenya — Press Releases"
        url: "https://www.centralbank.go.ke/press-releases/"
        type: "html"
        category: "regulatory"
        verified: true
        selectors:
          articles: "h3 a, .press-release a, article h2 a"

      - id: "ke_cma_news"
        name: "Capital Markets Authority Kenya"
        url: "https://www.cma.or.ke/index.php/media-center/news"
        type: "html"
        category: "regulatory"
        verified: true
        selectors:
          articles: "h3 a, h4 a, .news-item a"

      - id: "ke_bitcoinke"
        name: "BitcoinKE — Kenya Crypto News"
        url: "https://bitcoinke.io/feed/"
        type: "rss"
        category: "crypto_news"
        verified: true

      - id: "ke_techpoint"
        name: "TechPoint Africa"
        url: "https://techpoint.africa/feed/"
        type: "rss"
        category: "tech_news"
        verified: true

      - id: "ke_business_daily"
        name: "Business Daily Africa"
        url: "https://www.businessdailyafrica.com/bd/economy/rss"
        type: "rss"
        category: "business_news"
        verified: true

      - id: "ke_safaricom_investor"
        name: "Safaricom Investor Relations"
        url: "https://www.safaricom.co.ke/investor-relations/press-releases"
        type: "html"
        category: "market_signal"
        verified: true
        selectors:
          articles: "h3 a, .press-release-item a"

      - id: "ke_github_activity"
        name: "GitHub — Kenya Web3 Developer Activity"
        url: "https://api.github.com/search/repositories"
        type: "api_json"
        category: "dev_activity"
        verified: true
        params:
          q: "blockchain kenya OR web3 nairobi OR defi kenya"
          sort: "updated"
          per_page: 20

      - id: "ke_farcaster"
        name: "Farcaster — Kenya Web3 Channel"
        url: "https://api.warpcast.com/v2/casts"
        type: "farcaster"
        category: "social_web3"
        verified: true
        params:
          channel: "kenya"
          limit: 25

  # ── EAST AFRICA ────────────────────────────────────────────
